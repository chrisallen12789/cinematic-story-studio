name: Phase 3B Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3b-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Lint, test, build, and Phase 3B packaged E2E
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            apps/local-service/pyproject.toml
            apps/local-service/requirements.in
            apps/local-service/requirements.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Python 3.12 lock reproducibility with the pinned compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/python.mjs venv
          $servicePython = (node scripts/python.mjs path).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $servicePython -PathType Leaf)) {
            throw "The repository-owned Python environment was not created."
          }
          & $servicePython -m pip install --disable-pip-version-check --require-hashes --requirement apps/local-service/requirements.lock
          if ($LASTEXITCODE -ne 0) {
            throw "The hash-locked Python compiler environment failed to install."
          }
          pnpm service:python -c "import sys; raise SystemExit(0 if sys.version_info[:3] == (3, 12, 10) else 'Lock generation requires Python 3.12.10')"
          pnpm service:python -m piptools compile --allow-unsafe --generate-hashes --strip-extras --output-file apps/local-service/requirements.lock apps/local-service/requirements.in
          git diff --exit-code -- apps/local-service/requirements.lock

      - name: Install locked Node and Python development dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify locked secure-ingest parsers and deterministic public fixtures
        run: |
          node scripts/python.mjs exec -c "from importlib.metadata import version; assert version('lxml') == '6.1.1'; assert version('pypdf') == '6.14.2'"
          node --test schemas/tests/schema-structure.test.mjs schemas/tests/phase3b-schema-structure.test.mjs tests/tooling/synthetic-fixture.test.mjs tests/tooling/synthetic-voice-catalog.test.mjs tests/tooling/build-evidence.test.mjs

      - name: Lint TypeScript, Python, and repository content
        run: pnpm lint

      - name: Type-check TypeScript and Python
        run: pnpm typecheck

      - name: Run schema, tooling, service, and desktop tests
        run: pnpm test

      - name: Run focused Phase 2 migration, intelligence, API, correction, graph, and scale suites
        run: |
          node scripts/python.mjs exec -m pytest -q apps/local-service/tests/test_database_v3_migration.py apps/local-service/tests/test_whole_book_analysis.py apps/local-service/tests/test_phase2_api.py apps/local-service/tests/test_analysis_corrections_restart.py apps/local-service/tests/test_phase2_correction_scope_regressions.py apps/local-service/tests/test_phase2_structure_graph_regressions.py apps/local-service/tests/test_phase2_scale.py

      - name: Run focused Phase 3A migration, casting, rights-governance, and scale suites
        run: |
          node scripts/python.mjs exec -m pytest -q apps/local-service/tests/test_database_v4_migration.py apps/local-service/tests/test_phase3a_casting.py apps/local-service/tests/test_phase3a_custom_roles.py apps/local-service/tests/test_phase3a_assignment_invalidation.py apps/local-service/tests/test_phase3a_governance.py apps/local-service/tests/test_phase3a_jobs.py apps/local-service/tests/test_phase3a_scale.py

      - name: Run focused Phase 3B migration, model, pronunciation, audition, cache, runtime, and normalization suites
        run: |
          node scripts/python.mjs exec -m pytest -q apps/local-service/tests/test_database_v5_migration.py apps/local-service/tests/test_audio_qc.py apps/local-service/tests/test_phase3b_api.py apps/local-service/tests/test_phase3b_model_packages.py apps/local-service/tests/test_phase3b_model_transaction_compensation.py apps/local-service/tests/test_phase3b_pronunciation.py apps/local-service/tests/test_phase3b_pronunciation_lineage.py apps/local-service/tests/test_phase3b_audition_jobs.py apps/local-service/tests/test_phase3b_audition_repository.py apps/local-service/tests/test_phase3b_auditions.py apps/local-service/tests/test_phase3b_app_shutdown.py apps/local-service/tests/test_phase3b_atomic_publication.py apps/local-service/tests/test_phase3b_generation_idempotency.py apps/local-service/tests/test_phase3b_integrity_closure.py apps/local-service/tests/test_phase3b_review_idempotency.py apps/local-service/tests/test_phase3b_review_integrity.py apps/local-service/tests/test_phase3b_invalidation_reconciliation.py apps/local-service/tests/test_phase3b_workflow.py apps/local-service/tests/test_phase3b_speech_runtime.py apps/local-service/tests/test_phase3b_runtime_repository_lifecycle.py apps/local-service/tests/test_phase3b_speech_providers.py apps/local-service/tests/test_phase3b_real_provider.py apps/local-service/tests/test_phase3b_real_provider_command.py apps/local-service/tests/test_phase3b_text_normalization.py apps/local-service/tests/test_phase3b_schemas.py apps/local-service/tests/test_phase3b_scale.py

      - name: Prepare development Electron assets
        run: |
          pnpm --filter @cinematic-story-studio/contracts run build
          pnpm --filter @cinematic-story-studio/desktop run build

      - name: Run development governed local-speech auditions Electron E2E
        id: development_e2e
        continue-on-error: true
        env:
          CSS_E2E: "1"
        run: pnpm --filter @cinematic-story-studio/desktop exec playwright test tests/e2e/persistence.spec.ts

      - name: Build the exact staged service and unpackaged desktop
        id: build
        run: pnpm build

      - name: Verify exact staged frozen service runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $servicePath = [IO.Path]::GetFullPath(
            (Join-Path (Get-Location) "apps/desktop/build-resources/service/cinematic-story-service.exe")
          )
          if (-not (Test-Path -LiteralPath $servicePath -PathType Leaf)) {
            throw "The exact staged frozen service is unavailable."
          }
          $env:CINEMATIC_STORY_TEST_FROZEN_SERVICE = $servicePath
          node scripts/python.mjs exec -m pytest -q apps/local-service/tests/test_phase3b_speech_runtime.py -k frozen

      - name: Resolve packaged E2E evidence paths
        id: resolve_evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $desktopPackage = Get-Content -LiteralPath "apps/desktop/package.json" -Raw | ConvertFrom-Json
          $version = [string]$desktopPackage.version
          if ($version -cnotmatch "^[0-9A-Za-z][0-9A-Za-z.+-]{0,79}$") {
            throw "The desktop package version is invalid."
          }

          $workspaceRoot = [IO.Path]::GetFullPath((Get-Location))
          $releaseRoot = [IO.Path]::GetFullPath(
            (Join-Path $workspaceRoot "apps/desktop/release/$version")
          )
          $relativeReleaseRoot = [IO.Path]::GetRelativePath(
            $workspaceRoot,
            $releaseRoot
          )
          if (
            [IO.Path]::IsPathRooted($relativeReleaseRoot) -or
            $relativeReleaseRoot -eq ".." -or
            $relativeReleaseRoot.StartsWith("..$([IO.Path]::DirectorySeparatorChar)")
          ) {
            throw "The desktop release root escaped the workspace."
          }
          $executable = Join-Path $releaseRoot "win-unpacked/Cinematic Story Studio.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "The expected packaged desktop executable is missing."
          }

          $screenshotPath = Join-Path $releaseRoot "packaged-e2e.png"
          $resultPath = Join-Path $releaseRoot "packaged-e2e-result.json"
          $phase3ResultPath = Join-Path $releaseRoot "phase-3-packaged-e2e-result.json"
          $phase3VoiceCastingEvidencePath = Join-Path $releaseRoot "phase-3-voice-casting-evidence.json"
          $phase3bResultPath = Join-Path $releaseRoot "phase-3b-packaged-e2e-result.json"
          $manifestPath = Join-Path $releaseRoot "build-evidence.json"
          foreach ($generatedEvidence in @(
            $screenshotPath,
            $resultPath,
            $phase3ResultPath,
            $phase3VoiceCastingEvidencePath,
            $phase3bResultPath,
            $manifestPath
          )) {
            if (Test-Path -LiteralPath $generatedEvidence) {
              if (-not (Test-Path -LiteralPath $generatedEvidence -PathType Leaf)) {
                throw "A generated evidence target was not a file."
              }
              Remove-Item -LiteralPath $generatedEvidence -Force
            }
          }

          "CSS_PACKAGED_E2E_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSS_PACKAGED_E2E_EVIDENCE_PATH=$screenshotPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSS_PACKAGED_E2E_RESULT_PATH=$resultPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSS_PHASE3_PACKAGED_E2E_RESULT_PATH=$phase3ResultPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSS_PHASE3_VOICE_CASTING_EVIDENCE_PATH=$phase3VoiceCastingEvidencePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSS_PHASE3B_PACKAGED_E2E_RESULT_PATH=$phase3bResultPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSS_BUILD_EVIDENCE_MANIFEST_PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run exact packaged governed local-speech auditions persistence E2E
        id: packaged_e2e
        continue-on-error: true
        run: pnpm --filter @cinematic-story-studio/desktop run test:e2e:packaged

      - name: Generate deterministic build-evidence manifest
        id: build_evidence
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          CSS_BUILD_WORKFLOW_HEAD_SHA: ${{ github.sha }}
          CSS_BUILD_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CSS_PACKAGED_E2E_STEP_OUTCOME: ${{ steps.packaged_e2e.outcome }}
          CSS_BUILD_EVIDENCE_RUNNER_NAME: ${{ runner.name }}
          CSS_BUILD_EVIDENCE_RUNNER_OS: ${{ runner.os }}
          CSS_BUILD_EVIDENCE_RUNNER_ARCH: ${{ runner.arch }}
          CSS_BUILD_EVIDENCE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CSS_BUILD_EVIDENCE_RUN_ID: ${{ github.run_id }}
          CSS_BUILD_EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CSS_BUILD_EVIDENCE_WORKFLOW: ${{ github.workflow }}
          CSS_BUILD_EVIDENCE_JOB: ${{ github.job }}
        run: |
          $testedCheckoutSha = (& git rev-parse HEAD).Trim()
          if (
            $LASTEXITCODE -ne 0 -or
            $testedCheckoutSha -cne $env:CSS_BUILD_WORKFLOW_HEAD_SHA
          ) {
            throw "The checked-out commit does not match the workflow head SHA."
          }
          $env:CSS_BUILD_TESTED_CHECKOUT_SHA = $testedCheckoutSha
          $env:CSS_BUILD_EVIDENCE_TIMESTAMP = [DateTimeOffset]::UtcNow.ToString(
            "O",
            [Globalization.CultureInfo]::InvariantCulture
          )
          node scripts/ci/build-evidence.mjs

      - name: Validate schema-v7 Phase 3B result and schema-v6 build manifest
        id: manifest_validation
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.build_evidence.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/ci/build-evidence.mjs --validate-manifest $env:CSS_BUILD_EVIDENCE_MANIFEST_PATH

      - name: Print sanitized build evidence
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $manifestPath = $env:CSS_BUILD_EVIDENCE_MANIFEST_PATH
          if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
            Write-Output "::group::Build evidence manifest"
            Get-Content -LiteralPath $manifestPath -Raw
            Write-Output "::endgroup::"
          }

      - name: Re-scan tracked content
        id: tracked_scan
        run: pnpm scan:tracked

      - name: Verify checks did not modify tracked files
        id: clean_check
        run: node scripts/git-check.mjs --clean

      - name: Revalidate exact artifact bytes immediately before upload
        id: artifact_revalidation
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.manifest_validation.outcome == 'success' && steps.tracked_scan.outcome == 'success' && steps.clean_check.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/ci/build-evidence.mjs --validate-manifest $env:CSS_BUILD_EVIDENCE_MANIFEST_PATH

      - name: Upload failure diagnostics without application binaries
        if: ${{ always() && !cancelled() && (steps.development_e2e.outcome != 'success' || steps.packaged_e2e.outcome != 'success' || steps.build_evidence.outcome != 'success' || steps.manifest_validation.outcome != 'success' || steps.tracked_scan.outcome != 'success' || steps.clean_check.outcome != 'success' || steps.artifact_revalidation.outcome != 'success') }}
        uses: actions/upload-artifact@v6
        with:
          name: cinematic-story-studio-phase-3b-ci-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/desktop/test-results/**
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/build-evidence.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/packaged-e2e-result.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/phase-3-packaged-e2e-result.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/phase-3-voice-casting-evidence.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/phase-3b-packaged-e2e-result.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/packaged-e2e.png
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Upload short-lived development artifact
        if: ${{ always() && !cancelled() && steps.development_e2e.outcome == 'success' && steps.build.outcome == 'success' && steps.packaged_e2e.outcome == 'success' && steps.build_evidence.outcome == 'success' && steps.manifest_validation.outcome == 'success' && steps.tracked_scan.outcome == 'success' && steps.clean_check.outcome == 'success' && steps.artifact_revalidation.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: cinematic-story-studio-phase-3b-windows-unpacked-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/win-unpacked/**
            apps/desktop/build-resources/service/cinematic-story-service.exe
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/build-evidence.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/packaged-e2e-result.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/phase-3-packaged-e2e-result.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/phase-3-voice-casting-evidence.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/phase-3b-packaged-e2e-result.json
            apps/desktop/release/${{ steps.resolve_evidence.outputs.version }}/packaged-e2e.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Enforce packaged E2E result
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' && steps.packaged_e2e.outcome != 'success' }}
        shell: pwsh
        run: throw "The packaged governed local-speech auditions persistence E2E gate failed. Inspect the uploaded evidence."

      - name: Enforce build-evidence generation
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' && steps.build_evidence.outcome != 'success' }}
        shell: pwsh
        run: throw "The Phase 3B build-evidence generator rejected the packaged proof."

      - name: Enforce build-evidence manifest validation
        if: ${{ always() && !cancelled() && steps.build_evidence.outcome == 'success' && steps.manifest_validation.outcome != 'success' }}
        shell: pwsh
        run: throw "The schema-v7 Phase 3B result or schema-v6 build manifest failed validation."

      - name: Enforce exact artifact revalidation
        if: ${{ always() && !cancelled() && steps.manifest_validation.outcome == 'success' && steps.tracked_scan.outcome == 'success' && steps.clean_check.outcome == 'success' && steps.artifact_revalidation.outcome != 'success' }}
        shell: pwsh
        run: throw "The exact application or evidence bytes changed after initial manifest validation."

      - name: Enforce development Electron E2E result
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' && steps.development_e2e.outcome != 'success' }}
        shell: pwsh
        run: throw "The development Electron persistence E2E gate failed."
