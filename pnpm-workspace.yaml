packages:
  - apps/*
  - packages/*

# Keep the desktop-packager toolchain on patched transitive implementations;
# both APIs remain compatible with their existing consumers.
overrides:
  brace-expansion: 5.0.9
  fast-uri: 3.1.5

# pnpm 11 blocks dependency lifecycle scripts unless they are allow-listed.
# Electron, electron-winstaller, and esbuild need their pinned official install
# scripts to fetch or select platform-specific development binaries.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
